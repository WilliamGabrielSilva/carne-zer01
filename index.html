<script>

/* =========================================================
   JSPDF
========================================================= */

const { jsPDF } = window.jspdf;


/* =========================================================
   FORMATAÇÃO CPF / CNPJ
========================================================= */

function formatarCpfCnpj(valor){

    let n =
        String(valor || "")
            .replace(/\D/g,"")
            .slice(0,14);


    if(n.length <= 11){

        if(n.length <= 3){

            return n;
        }


        if(n.length <= 6){

            return n.replace(
                /(\d{3})(\d+)/,
                "$1.$2"
            );
        }


        if(n.length <= 9){

            return n.replace(
                /(\d{3})(\d{3})(\d+)/,
                "$1.$2.$3"
            );
        }


        return n.replace(
            /(\d{3})(\d{3})(\d{3})(\d{1,2})/,
            "$1.$2.$3-$4"
        );
    }


    return n.replace(
        /(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/,
        function(_,a,b,c,d,e){

            return (
                a +
                "." +
                b +
                "." +
                c +
                "/" +
                d +
                (
                    e
                        ? "-" + e
                        : ""
                )
            );
        }
    );
}


/* =========================================================
   FORMATAÇÃO TELEFONE
========================================================= */

function formatarTelefone(valor){

    let n =
        String(valor || "")
            .replace(/\D/g,"")
            .slice(0,11);


    if(!n){

        return "";
    }


    if(n.length <= 2){

        return "(" + n;
    }


    if(n.length <= 6){

        return (
            "(" +
            n.slice(0,2) +
            ") " +
            n.slice(2)
        );
    }


    if(n.length <= 10){

        return (
            "(" +
            n.slice(0,2) +
            ") " +
            n.slice(2,6) +
            "-" +
            n.slice(6)
        );
    }


    return (
        "(" +
        n.slice(0,2) +
        ") " +
        n.slice(2,7) +
        "-" +
        n.slice(7)
    );
}


/* =========================================================
   EVENTOS DE FORMATAÇÃO
========================================================= */

document
    .getElementById("cpf")
    .addEventListener(
        "input",
        function(){

            this.value =
                formatarCpfCnpj(
                    this.value
                );
        }
    );


document
    .getElementById("telefone")
    .addEventListener(
        "input",
        function(){

            this.value =
                formatarTelefone(
                    this.value
                );
        }
    );


/* =========================================================
   MOEDA
========================================================= */

function formatarMoeda(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );
}


/* =========================================================
   DATA
========================================================= */

function formatarData(data){

    if(!data){

        return "";
    }


    const partes =
        data.split("-");


    if(partes.length !== 3){

        return data;
    }


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );
}


/* =========================================================
   ADICIONAR MESES
========================================================= */

function adicionarMeses(data, meses){

    const d =
        new Date(
            data + "T12:00:00"
        );


    const diaOriginal =
        d.getDate();


    d.setMonth(
        d.getMonth() + meses
    );


    if(
        d.getDate() !==
        diaOriginal
    ){

        d.setDate(0);
    }


    const ano =
        d.getFullYear();


    const mes =
        String(
            d.getMonth()+1
        ).padStart(2,"0");


    const dia =
        String(
            d.getDate()
        ).padStart(2,"0");


    return (
        ano +
        "-" +
        mes +
        "-" +
        dia
    );
}


/* =========================================================
   CARREGAR LOGO
========================================================= */

function carregarImagemLogo(){

    return new Promise(
        function(resolve,reject){

            const imagem =
                new Image();


            imagem.onload =
                function(){

                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        imagem.naturalWidth;


                    canvas.height =
                        imagem.naturalHeight;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        imagem,
                        0,
                        0
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/png"
                        )
                    );
                };


            imagem.onerror =
                function(){

                    reject(
                        "Não foi possível carregar logo.png"
                    );
                };


            imagem.src =
                "logo.png";
        }
    );
}


/* =========================================================
   CRIAR TOKEN SEGURO
========================================================= */

async function criarCobranca(dados){

    const resposta =
        await fetch(
            "/api/cobranca",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        dados
                    )
            }
        );


    const resultado =
        await resposta.json();


    if(
        !resposta.ok ||
        !resultado.token
    ){

        throw new Error(
            resultado.erro ||
            "Não foi possível criar a cobrança."
        );
    }


    return resultado.token;
}


/* =========================================================
   GERAR QR CODE
========================================================= */

async function gerarImagemQR(texto){

    return new Promise(
        function(resolve,reject){

            const div =
                document.createElement(
                    "div"
                );


            div.style.position =
                "absolute";


            div.style.left =
                "-99999px";


            document.body.appendChild(
                div
            );


            try{

                new QRCode(
                    div,
                    {
                        text:texto,

                        width:400,

                        height:400,

                        correctLevel:
                            QRCode.CorrectLevel.M
                    }
                );

            }catch(e){

                document.body.removeChild(
                    div
                );

                reject(e);

                return;
            }


            setTimeout(
                function(){

                    const canvas =
                        div.querySelector(
                            "canvas"
                        );


                    if(!canvas){

                        document.body.removeChild(
                            div
                        );


                        reject(
                            "Não foi possível gerar o QR Code."
                        );

                        return;
                    }


                    const imagem =
                        canvas.toDataURL(
                            "image/png"
                        );


                    document.body.removeChild(
                        div
                    );


                    resolve(imagem);

                },
                300
            );
        }
    );
}


/* =========================================================
   DESENHAR PARCELA
   A4 HORIZONTAL
========================================================= */

function desenharParcela(
    pdf,
    dados,
    qrImagem,
    numero,
    totalParcelas,
    y,
    logo
){

    const x = 8;

    const largura = 281;

    const altura = 95;


    /*
        DIVISÃO PRINCIPAL

        ESQUERDA = PAGAMENTO
        DIREITA  = CLIENTE
    */

    const divisaoX =
        x + 190;


    /* ==========================================
       BORDA EXTERNA
    ========================================== */

    pdf.setDrawColor(
        35,
        35,
        35
    );

    pdf.setLineWidth(.5);


    pdf.roundedRect(
        x,
        y,
        largura,
        altura,
        2,
        2
    );


    /* ==========================================
       DIVISÃO VERTICAL
    ========================================== */

    pdf.setDrawColor(
        100,
        100,
        100
    );

    pdf.setLineWidth(.4);


    pdf.line(
        divisaoX,
        y,
        divisaoX,
        y + altura
    );


    /* ==========================================
       LOGO
    ========================================== */

    try{

        pdf.addImage(
            logo,
            "PNG",
            x + 5,
            y + 5,
            40,
            15
        );

    }catch(e){}


    /* ==========================================
       TÍTULO
    ========================================== */

    pdf.setTextColor(
        20,
        20,
        20
    );


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(15);


    pdf.text(
        "CARNÊ DE PAGAMENTO",
        x + 105,
        y + 12,
        {
            align:"center"
        }
    );


    /* ==========================================
       PARCELA
    ========================================== */

    pdf.setFontSize(10);


    pdf.text(
        "PARCELA " +
        numero +
        "/" +
        totalParcelas,
        divisaoX - 5,
        y + 10,
        {
            align:"right"
        }
    );


    /* ==========================================
       LINHA DO CABEÇALHO
    ========================================== */

    pdf.setDrawColor(
        100,
        100,
        100
    );


    pdf.line(
        x + 5,
        y + 22,
        divisaoX - 5,
        y + 22
    );


    /* =====================================================
       ESQUERDA — INFORMAÇÕES DE PAGAMENTO
    ===================================================== */


    /* ==========================================
       VENCIMENTO
    ========================================== */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(8);


    pdf.text(
        "VENCIMENTO",
        x + 7,
        y + 31
    );


    pdf.setFontSize(13);


    pdf.text(
        formatarData(
            dados.vencimento
        ),
        x + 7,
        y + 39
    );


    /* ==========================================
       VALOR
    ========================================== */

    pdf.setFontSize(8);


    pdf.text(
        "VALOR DA PARCELA",
        x + 75,
        y + 31
    );


    pdf.setFontSize(15);


    pdf.text(
        formatarMoeda(
            dados.valor
        ),
        x + 75,
        y + 39
    );


    /* ==========================================
       PAGAMENTO VIA PIX
    ========================================== */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(9);


    pdf.text(
        "PAGAMENTO VIA PIX",
        x + 7,
        y + 49
    );


    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.setFontSize(7.5);


    pdf.text(
        "Aponte a câmera para o QR Code",
        x + 7,
        y + 56
    );


    pdf.text(
        "para consultar e pagar esta parcela.",
        x + 7,
        y + 62
    );


    /* ==========================================
       QR CODE
    ========================================== */

    pdf.addImage(
        qrImagem,
        "PNG",
        x + 145,
        y + 47,
        38,
        38
    );


    /* ==========================================
       TEXTO AO LADO DO QR
    ========================================== */

    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.setFontSize(6.5);


    pdf.text(
        "Escaneie para acessar",
        x + 164,
        y + 88,
        {
            align:"center"
        }
    );


    pdf.text(
        "a página de pagamento.",
        x + 164,
        y + 92,
        {
            align:"center"
        }
    );


    /* ==========================================
       AVISO
    ========================================== */

    pdf.setFontSize(6.5);


    pdf.text(
        "Valor atualizado automaticamente em caso de atraso.",
        x + 7,
        y + 88
    );


    /* =====================================================
       DIREITA — DADOS DO CLIENTE
    ===================================================== */

    const clienteX =
        divisaoX + 7;


    const clienteDireita =
        x + largura - 7;


    const clienteLargura =
        clienteDireita -
        clienteX;


    /* ==========================================
       TÍTULO DO QUADRO
    ========================================== */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(11);


    pdf.text(
        "DADOS DO CLIENTE",
        clienteX,
        y + 11
    );


    /* ==========================================
       LINHA DO TÍTULO
    ========================================== */

    pdf.setDrawColor(
        120,
        120,
        120
    );


    pdf.line(
        clienteX,
        y + 16,
        clienteDireita,
        y + 16
    );


    /* ==========================================
       CLIENTE
    ========================================== */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(7);


    pdf.text(
        "CLIENTE",
        clienteX,
        y + 24
    );


    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.setFontSize(9);


    const nome =
        dados.cliente || "-";


    const nomeLinhas =
        pdf.splitTextToSize(
            nome,
            clienteLargura
        );


    pdf.text(
        nomeLinhas.slice(0,1),
        clienteX,
        y + 30
    );


    /* ==========================================
       CPF / CNPJ
    ========================================== */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(7);


    pdf.text(
        "CPF / CNPJ",
        clienteX,
        y + 40
    );


    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.setFontSize(9);


    pdf.text(
        formatarCpfCnpj(
            dados.cpf
        ) || "-",
        clienteX,
        y + 46
    );


    /* ==========================================
       ENDEREÇO
    ========================================== */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(7);


    pdf.text(

/* =========================================================
   GERAR CARNÊ
========================================================= */

async function gerarCarne(){

    const btn =
        document.getElementById(
            "btnGerar"
        );


    const carregando =
        document.getElementById(
            "carregando"
        );


    const cliente =
        document
            .getElementById("cliente")
            .value
            .trim();


    const cpf =
        document
            .getElementById("cpf")
            .value
            .trim();


    const telefone =
        document
            .getElementById("telefone")
            .value
            .trim();


    const endereco =
        document
            .getElementById("endereco")
            .value
            .trim();


    const valorTotal =
        Number(
            document
                .getElementById("valor")
                .value
        );


    const quantidade =
        Number(
            document
                .getElementById("parcelas")
                .value
        );


    const primeiroVencimento =
        document
            .getElementById(
                "primeiroVencimento"
            )
            .value;


    const pix =
        document
            .getElementById("pix")
            .value
            .trim();


    const multa =
        Number(
            document
                .getElementById("multa")
                .value
        ) || 0;


    const juros =
        Number(
            document
                .getElementById("juros")
                .value
        ) || 0;


    /* =================================================
       VALIDAÇÕES
    ================================================= */


    if(!cliente){

        alert(
            "Informe o nome do cliente."
        );

        return;
    }


    if(
        !valorTotal ||
        valorTotal <= 0
    ){

        alert(
            "Informe o valor total da venda."
        );

        return;
    }


    if(
        !quantidade ||
        quantidade < 1
    ){

        alert(
            "Informe o número de parcelas."
        );

        return;
    }


    if(!primeiroVencimento){

        alert(
            "Informe o primeiro vencimento."
        );

        return;
    }


    if(!pix){

        alert(
            "Informe a chave PIX."
        );

        return;
    }


    /*
        O gerador precisa estar hospedado no Vercel
        para que os QR Codes apontem para uma página
        de pagamento real.
    */

    if(
        window.location.protocol ===
        "file:"
    ){

        alert(
            "Abra o sistema pelo endereço do Vercel para gerar os QR Codes de pagamento."
        );

        return;
    }


    try{

        btn.disabled = true;

        carregando.style.display =
            "block";


        /* =================================================
           LOGO
        ================================================= */

        const logo =
            await carregarImagemLogo();


        /* =================================================
           CÁLCULO EM CENTAVOS
        ================================================= */

        const totalCentavos =
            Math.round(
                valorTotal * 100
            );


        const valorBase =
            Math.floor(
                totalCentavos /
                quantidade
            );


        const resto =
            totalCentavos -
            (
                valorBase *
                quantidade
            );


        /* =================================================
           CRIAR PDF
        ================================================= */

        const pdf =
            new jsPDF({
                orientation:"landscape",
                unit:"mm",
                format:"a4"
            });


        /*
            Primeiro criamos todos os tokens.
        */

        const cobrancas = [];


        for(
            let i = 0;
            i < quantidade;
            i++
        ){

            let valorParcela =
                valorBase;


            /*
                Diferença de arredondamento
                fica na última parcela.
            */

            if(
                i === quantidade - 1
            ){

                valorParcela +=
                    resto;
            }


            const vencimento =
                adicionarMeses(
                    primeiroVencimento,
                    i
                );


            const dadosCobranca = {

                cliente:
                    cliente,

                cpf:
                    cpf,

                telefone:
                    telefone,

                endereco:
                    endereco,

                parcela:
                    (i + 1) +
                    "/" +
                    quantidade,

                vencimento:
                    vencimento,

                valor:
                    valorParcela / 100,

                multa:
                    multa,

                juros:
                    juros,

                pix:
                    pix
            };


            const token =
                await criarCobranca(
                    dadosCobranca
                );


            cobrancas.push({

                dados:
                    dadosCobranca,

                token:
                    token
            });
        }


        /* =================================================
           DESENHAR PDF
        ================================================= */

        for(
            let i = 0;
            i < cobrancas.length;
            i++
        ){

            /*
                2 parcelas por página.
            */

            if(
                i > 0 &&
                i % 2 === 0
            ){

                pdf.addPage();
            }


            const posicao =
                i % 2;


            const y =
                posicao === 0
                    ? 5
                    : 110;


            const cobranca =
                cobrancas[i];


            /*
                QR abre a página de pagamento.
            */

            const urlPagamento =
                window.location.origin +
                window.location.pathname +
                "?token=" +
                encodeURIComponent(
                    cobranca.token
                );


            const qrImagem =
                await gerarImagemQR(
                    urlPagamento
                );


            desenharParcela(
                pdf,
                cobranca.dados,
                qrImagem,
                i + 1,
                quantidade,
                y,
                logo
            );


            /*
                Linha de corte entre as parcelas.
            */

            if(
                posicao === 0
            ){

                pdf.setDrawColor(
                    120,
                    120,
                    120
                );


                pdf.setLineDashPattern(
                    [3,2],
                    0
                );


                pdf.line(
                    8,
                    105,
                    289,
                    105
                );


                pdf.setLineDashPattern(
                    [],
                    0
                );
            }
        }


        /* =================================================
           SALVAR
        ================================================= */

        const nomeArquivo =
            "Carne-" +
            cliente
                .replace(
                    /[^a-zA-Z0-9À-ÿ ]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    "-"
                ) +
            ".pdf";


        pdf.save(
            nomeArquivo
        );


    }catch(erro){

        console.error(
            erro
        );


        alert(
            "Erro ao gerar o carnê:\n\n" +
            (
                erro.message ||
                erro
            )
        );


    }finally{

        btn.disabled = false;

        carregando.style.display =
            "none";
    }
}


/* =========================================================
   PÁGINA DE PAGAMENTO
========================================================= */

async function abrirPaginaPagamento(token){

    document.getElementById(
        "paginaGerador"
    ).style.display =
        "none";


    document.getElementById(
        "paginaPagamento"
    ).style.display =
        "block";


    const status =
        document.getElementById(
            "statusPagamento"
        );


    const conteudo =
        document.getElementById(
            "conteudoPagamento"
        );


    status.innerText =
        "Validando cobrança...";


    try{

        const resposta =
            await fetch(
                "/api/cobranca?token=" +
                encodeURIComponent(
                    token
                )
            );


        const resultado =
            await resposta.json();


        if(
            !resposta.ok ||
            !resultado.sucesso
        ){

            throw new Error(
                resultado.erro ||
                "Cobrança inválida."
            );
        }


        const dados =
            resultado.dados;


        /* =================================================
           CALCULAR ATRASO
        ================================================= */

        const vencimento =
            new Date(
                dados.vencimento +
                "T23:59:59"
            );


        const agora =
            new Date();


        let diasAtraso = 0;


        if(
            agora > vencimento
        ){

            diasAtraso =
                Math.floor(
                    (
                        agora.getTime() -
                        vencimento.getTime()
                    ) /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )
                );


            if(
                diasAtraso < 0
            ){

                diasAtraso = 0;
            }
        }


        const valorOriginal =
            Number(
                dados.valor || 0
            );


        let valorMulta = 0;

        let valorJuros = 0;


        if(
            diasAtraso > 0
        ){

            valorMulta =
                valorOriginal *
                (
                    Number(
                        dados.multa || 0
                    ) /
                    100
                );


            valorJuros =
                valorOriginal *
                (
                    Number(
                        dados.juros || 0
                    ) /
                    100
                ) *
                diasAtraso;
        }


        valorMulta =
            Math.round(
                valorMulta * 100
            ) / 100;


        valorJuros =
            Math.round(
                valorJuros * 100
            ) / 100;


        const valorTotal =
            Math.round(
                (
                    valorOriginal +
                    valorMulta +
                    valorJuros
                ) *
                100
            ) / 100;


        /* =================================================
           PIX
        ================================================= */

        const pixCopiaECola =
            gerarPix(
                dados.pix,
                valorTotal
            );


        /* =================================================
           QR CODE PIX
        ================================================= */

        const qrContainer =
            document.createElement(
                "div"
            );


        qrContainer.style.position =
            "absolute";


        qrContainer.style.left =
            "-99999px";


        document.body.appendChild(
            qrContainer
        );


        new QRCode(
            qrContainer,
            {
                text:
                    pixCopiaECola,

                width:
                    500,

                height:
                    500,

                correctLevel:
                    QRCode.CorrectLevel.M
            }
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    300
                )
        );


        const canvas =
            qrContainer.querySelector(
                "canvas"
            );


        if(!canvas){

            throw new Error(
                "Não foi possível gerar o QR Code PIX."
            );
        }


        const qrData =
            canvas.toDataURL(
                "image/png"
            );


        document.body.removeChild(
            qrContainer
        );


        /* =================================================
           EXIBIR
        ================================================= */

        status.innerText =
            diasAtraso > 0
                ? "Esta parcela está em atraso."
                : "Parcela em dia.";


        let html = "";


        html += `

            <div class="resumo">


                <div class="item">

                    <span>
                        Cliente
                    </span>

                    <strong>
                        ${escaparHTML(
                            dados.cliente || "-"
                        )}
                    </strong>

                </div>


                <div class="item">

                    <span>
                        Parcela
                    </span>

                    <strong>
                        ${escaparHTML(
                            dados.parcela || "-"
                        )}
                    </strong>

                </div>


                <div class="item">

                    <span>
                        Vencimento
                    </span>

                    <strong>
                        ${formatarData(
                            dados.vencimento
                        )}
                    </strong>

                </div>


                ${
                    dados.telefone
                    ?
                    `

                    <div class="item">

                        <span>
                            Telefone
                        </span>

                        <strong>
                            ${escaparHTML(
                                formatarTelefone(
                                    dados.telefone
                                )
                            )}
                        </strong>

                    </div>

                    `
                    :
                    ""
                }


                ${
                    diasAtraso > 0
                    ?
                    `

                    <div class="item">

                        <span>
                            Dias em atraso
                        </span>

                        <strong>
                            ${diasAtraso}
                        </strong>

                    </div>


                    <div class="item">

                        <span>
                            Valor original
                        </span>

                        <strong>
                            ${formatarMoeda(
                                valorOriginal
                            )}
                        </strong>

                    </div>


                    <div class="item">

                        <span>
                            Multa
                        </span>

                        <strong>
                            ${formatarMoeda(
                                valorMulta
                            )}
                        </strong>

                    </div>


                    <div class="item">

                        <span>
                            Juros
                        </span>

                        <strong>
                            ${formatarMoeda(
                                valorJuros
                            )}
                        </strong>

                    </div>

                    `
                    :
                    ""
                }


                <div class="item total">

                    <span>
                        Total para pagamento
                    </span>

                    <strong>
                        ${formatarMoeda(
                            valorTotal
                        )}
                    </strong>

                </div>


            </div>
        `;


        html += `

            <div class="qr-area">

                <img
                    src="${qrData}"
                    style="
                        width:240px;
                        height:240px;
                        display:block;
                        margin:auto;
                    "
                >


                <div
                    style="
                        color:#111;
                        font-weight:bold;
                        margin-top:12px;
                    "
                >
                    PIX
                </div>


                <div
                    style="
                        color:#555;
                        font-size:13px;
                        margin-top:5px;
                    "
                >
                    Escaneie o QR Code para pagar
                    ${formatarMoeda(valorTotal)}.
                </div>

            </div>
        `;


        html += `

            <div class="pix-box">

                <label>
                    PIX COPIA E COLA
                </label>


                <div
                    class="pix-code"
                    id="pixCodigo"
                >
                    ${escaparHTML(
                        pixCopiaECola
                    )}
                </div>


                <button
                    class="copiar"
                    onclick="copiarPix()"
                >
                    COPIAR PIX
                </button>

            </div>
        `;


        conteudo.innerHTML =
            html;


        window.pixAtual =
            pixCopiaECola;


    }catch(erro){

        console.error(
            erro
        );


        status.innerText =
            "";


        conteudo.innerHTML = `

            <div class="erro">

                ${
                    escaparHTML(
                        erro.message ||
                        "Não foi possível carregar esta cobrança."
                    )
                }

            </div>

        `;
    }
}


/* =========================================================
   PIX BR CODE
   CRC-16-CCITT-FALSE
========================================================= */

function gerarPix(chave, valor){

    /*
        Remove espaços acidentais
        do início e do final da chave.
    */

    const chavePix =
        String(
            chave || ""
        ).trim();


    /*
        Valor sempre com duas casas decimais.
    */

    const valorFormatado =
        Number(
            valor
        ).toFixed(2);


    /* =====================================================
       CRIAR CAMPO EM FORMATO EMV
    ===================================================== */

    function campo(id, valor){

        const texto =
            String(
                valor
            );


        return (
            id +
            texto.length
                .toString()
                .padStart(2,"0") +
            texto
        );
    }


    /* =====================================================
       CRC-16-CCITT-FALSE

       POLINÔMIO:
       0x1021

       VALOR INICIAL:
       0xFFFF

       SEM REFLEXÃO

       XOR FINAL:
       0x0000
    ===================================================== */

    function crc16(payload){

        let crc =
            0xFFFF;


        for(
            let i = 0;
            i < payload.length;
            i++
        ){

            crc ^=
                payload.charCodeAt(i) << 8;


            for(
                let j = 0;
                j < 8;
                j++
            ){

                if(
                    crc & 0x8000
                ){

                    crc =
                        (
                            crc << 1
                        ) ^
                        0x1021;

                }else{

                    crc =
                        crc << 1;
                }


                crc &=
                    0xFFFF;
            }
        }


        return crc
            .toString(16)
            .toUpperCase()
            .padStart(
                4,
                "0"
            );
    }


    /* =====================================================
       MERCHANT ACCOUNT INFORMATION
    ===================================================== */

    const merchantAccountInformation =

        campo(
            "00",
            "br.gov.bcb.pix"
        ) +

        campo(
            "01",
            chavePix
        );


    /* =====================================================
       PAYLOAD PRINCIPAL
    ===================================================== */

    let payload = "";


    /* =====================================================
       PAYLOAD FORMAT INDICATOR
    ===================================================== */

    payload += campo(
        "00",
        "01"
    );


    /* =====================================================
       MERCHANT ACCOUNT INFORMATION
    ===================================================== */

    payload += campo(
        "26",
        merchantAccountInformation
    );


    /* =====================================================
       MERCHANT CATEGORY CODE
    ===================================================== */

    payload += campo(
        "52",
        "0000"
    );


    /* =====================================================
       CURRENCY

       986 = BRL
    ===================================================== */

    payload += campo(
        "53",
        "986"
    );


    /* =====================================================
       TRANSACTION AMOUNT
    ===================================================== */

    payload += campo(
        "54",
        valorFormatado
    );


    /* =====================================================
       COUNTRY CODE
    ===================================================== */

    payload += campo(
        "58",
        "BR"
    );


    /* =====================================================
       MERCHANT NAME
    ===================================================== */

    payload += campo(
        "59",
        "ZER01"
    );


    /* =====================================================
       MERCHANT CITY
    ===================================================== */

    payload += campo(
        "60",
        "LONDRINA"
    );


    /* =====================================================
       ADDITIONAL DATA FIELD

       TXID = ***
    ===================================================== */

    const campo62 =
        campo(
            "05",
            "***"
        );


    payload += campo(
        "62",
        campo62
    );


    /* =====================================================
       CRC

       O "6304" participa do cálculo.

       O próprio CRC é acrescentado
       somente depois do cálculo.
    ===================================================== */

    const payloadParaCRC =
        payload +
        "6304";


    const crc =
        crc16(
            payloadParaCRC
        );


    /* =====================================================
       PIX COPIA E COLA FINAL
    ===================================================== */

    return (
        payloadParaCRC +
        crc
    );
}


/* =========================================================
   COPIAR PIX
========================================================= */

async function copiarPix(){

    if(!window.pixAtual){

        return;
    }


    try{

        await navigator.clipboard.writeText(
            window.pixAtual
        );


        const botao =
            document.querySelector(
                ".copiar"
            );


        if(botao){

            const textoOriginal =
                botao.innerText;


            botao.innerText =
                "PIX COPIADO!";


            setTimeout(
                function(){

                    botao.innerText =
                        textoOriginal;

                },
                2000
            );
        }


    }catch(e){

        alert(
            "Não foi possível copiar automaticamente. Selecione o código PIX manualmente."
        );
    }
}


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escaparHTML(valor){

    return String(
        valor || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}
